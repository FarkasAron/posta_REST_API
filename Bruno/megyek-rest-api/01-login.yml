info:
  name: 01-login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8000/api/login
  body:
    type: json
    data: |-
      {
          "email": "test@example.com",
          "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("token", res.body.token);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
