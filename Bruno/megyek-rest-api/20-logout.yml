info:
  name: 20-logout
  type: http
  seq: 20

http:
  method: POST
  url: http://localhost:8000/api/logout
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
