info:
  name: city-update-patch
  type: http
  seq: 8

http:
  method: PATCH
  url: http://localhost:8000/api/cities/{{city_id}}
  body:
    type: json
    data: |-
      {
          "population": 2000
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
