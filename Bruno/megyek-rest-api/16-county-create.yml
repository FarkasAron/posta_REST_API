info:
  name: 16-county-create
  type: http
  seq: 16

http:
  method: POST
  url: http://localhost:8000/api/counties
  body:
    type: json
    data: |-
      {
          "name": "Teszt megye"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("county_id", res.body.data.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
