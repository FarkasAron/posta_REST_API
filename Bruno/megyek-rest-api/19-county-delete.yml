info:
  name: 19-county-delete
  type: http
  seq: 19

http:
  method: DELETE
  url: http://localhost:8000/api/counties/{{county_id}}
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
